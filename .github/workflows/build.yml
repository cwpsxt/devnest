# 打包：每次推送都会编译出 DevNest.exe，可以在这次运行的 Artifacts 里下载。
# 推送 v 开头的标签（例如 v0.1.0）时，还会把 exe 发布到 Releases 页面。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试（模拟环境）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 代码格式
        run: |
          unformatted="$(gofmt -l internal cmd ./*.go)"
          if [ -n "$unformatted" ]; then
            echo "这些文件需要 gofmt："; echo "$unformatted"; exit 1
          fi
      - name: 静态检查
        run: |
          go vet ./internal/... ./cmd/...
          GOOS=windows GOARCH=amd64 go vet ./internal/... ./cmd/...
      - name: 单元测试和模拟安装测试
        run: go test ./internal/...

  windows:
    name: 打包 Windows 程序
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # 只在推送标签时用来把 exe 挂到 Release 上
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 标签要和程序里的版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/core/manager.go)"
          if [ "$want" != "$have" ]; then
            echo "::error::标签是 v$want，但 internal/core/manager.go 里的 AppVersion 是 $have。先改版本号再打标签。"
            exit 1
          fi

      - name: 安装 Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: 编译桌面程序
        run: wails build -platform windows/amd64 -webview2 embed -trimpath -clean

      # 清单在 build/windows/wails.exe.manifest；这个文件没进仓库时 Wails 会用自带的、不申请权限的清单
      - name: 确认程序会申请管理员权限
        shell: pwsh
        run: |
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('build/bin/DevNest.exe'))
          if (-not $text.Contains('requireAdministrator')) { throw 'DevNest.exe 里没有申请管理员权限的清单' }

      - name: 检查主程序包
        run: go vet .

      - name: 编译命令行版
        run: go build -trimpath -ldflags "-s -w" -o build/bin/devnestcli.exe ./cmd/devnestcli

      - uses: actions/upload-artifact@v4
        with:
          name: DevNest-windows-amd64
          path: |
            build/bin/DevNest.exe
            build/bin/devnestcli.exe
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/bin/DevNest.exe build/bin/devnestcli.exe \
            --title "小熙 DevNest $GITHUB_REF_NAME" --generate-notes
